name: AutoMorph Cloud Patch Runner

on:
  workflow_dispatch:
    inputs:
      target_package:
        description: 'Specific package to patch (optional)'
        required: false
        default: ''
      runner_callback_url:
        description: 'Cloudflare Worker URL to report metrics back to'
        required: false
        default: ''

  # Also allows running on schedule directly if desired
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write
  packages: write

jobs:
  patch-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Java 21 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq aapt protobuf-compiler

      - name: Download Morphe Desktop JAR
        run: |
          mkdir -p tools
          MORPHE_VERSION="1.19.0"
          wget -q -O "tools/morphe.jar" \
            "https://github.com/MorpheApp/morphe-desktop/releases/download/v${MORPHE_VERSION}/morphe-desktop-${MORPHE_VERSION}-all.jar"
          ls -lh tools/morphe.jar
          java -jar tools/morphe.jar -v || true

      - name: Sync configuration and state from Cloudflare Worker (if available)
        env:
          CF_WORKER_URL: ${{ inputs.runner_callback_url || secrets.CLOUDFLARE_WORKER_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          if [ -n "$CF_WORKER_URL" ]; then
            echo "[*] Fetching configuration and build state from Cloudflare Worker: $CF_WORKER_URL"
            python3 -c "
          import urllib.request, json, yaml, os
          from pathlib import Path

          url = os.environ.get('CF_WORKER_URL').rstrip('/') + '/api/runner/sync'
          secret = os.environ.get('WEBHOOK_SECRET', '')
          try:
              headers = {'User-Agent': 'AutoMorph-CloudRunner'}
              if secret:
                  headers['X-Webhook-Secret'] = secret
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=15) as resp:
                  payload = json.loads(resp.read().decode())
                  config = payload.get('config', {})
                  patched_apps = payload.get('patched_apps', [])
                  repo_versions = payload.get('repo_versions', {})

                  os.makedirs('tools/automorph-data/state', exist_ok=True)
                  with open('tools/automorph-data/config.yaml', 'w') as f:
                      yaml.dump(config, f)

                  if repo_versions:
                      with open('tools/automorph-data/state/repo_versions.json', 'w') as f:
                          json.dump(repo_versions, f, indent=2)

                  # Populate stubs for already-patched apps so main.py skips up-to-date versions
                  stub_count = 0
                  for app in patched_apps:
                      pkg = app.get('package')
                      ver = app.get('version')
                      fname = app.get('filename')
                      if pkg and ver and fname:
                          stub_path = Path('apps/patched') / pkg / ver / fname
                          stub_path.parent.mkdir(parents=True, exist_ok=True)
                          if not stub_path.exists():
                              stub_path.touch()
                              stub_count += 1
                  print(f'[✓] Successfully synced config and {stub_count} existing app stubs from Worker D1.')
          except Exception as e:
              print(f'[!] Could not fetch runner state from Worker: {e}. Falling back to defaults.')
          " || true
          fi

      - name: Run AutoMorph Patching Pipeline
        id: patch
        env:
          TARGET_PACKAGE: ${{ inputs.target_package }}
          GOOPDL_ACCOUNT_EMAIL: ${{ secrets.GOOPDL_ACCOUNT_EMAIL }}
          GOOPDL_AAS_TOKEN: ${{ secrets.GOOPDL_AAS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p apps/original apps/patched tools/automorph-data/state/logs tools/automorph-data/state/reports
          START_TIME=$(date +%s)
          
          # Run main patcher
          python scripts/main.py ${TARGET_PACKAGE:-} 2>&1 | tee tools/automorph-data/state/logs/last_run.log || true

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "DURATION=$DURATION" >> $GITHUB_OUTPUT

      - name: Clean up unchanged app stubs
        run: |
          # Remove 0-byte stubs so only newly compiled APKs remain in apps/patched
          find apps/patched -name "*.apk" -size 0 -delete
          find apps/patched -type d -empty -delete

      - name: Create GitHub Release for Patched APKs
        id: release
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find newly compiled APKs (> 1MB)
          APK_FILES=$(find apps/patched -name "*.apk" -size +1M 2>/dev/null || true)
          
          if [ -n "$APK_FILES" ]; then
            DATE_TAG="build-$(date +%Y%m%d-%H%M%S)"
            echo "TAG=$DATE_TAG" >> $GITHUB_OUTPUT
            REPO="${{ github.repository }}"
            
            NOTES_FILE="release_notes_${DATE_TAG}.md"
            echo "## 🚀 AutoMorph Cloud Build \`${DATE_TAG}\`" > "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            echo "### 📦 Newly Built APKs in this Release:" >> "$NOTES_FILE"
            
            for apk in $APK_FILES; do
              fname=$(basename "$apk")
              ver_dir=$(basename $(dirname "$apk"))
              pkg_dir=$(basename $(dirname $(dirname "$apk")))
              
              app_name="$pkg_dir"
              if [ "$pkg_dir" = "com.reddit.frontpage" ]; then app_name="Reddit"; fi
              if [ "$pkg_dir" = "com.google.android.youtube" ]; then app_name="YouTube"; fi
              if [ "$pkg_dir" = "com.google.android.apps.youtube.music" ]; then app_name="YouTube Music"; fi
              if [ "$pkg_dir" = "com.twitter.android" ]; then app_name="Twitter"; fi
              
              PER_APP_TAG="app-${pkg_dir}"
              echo "" >> "$NOTES_FILE"
              echo "- **${app_name}** (\`${pkg_dir}\`) - \`v${ver_dir}\`" >> "$NOTES_FILE"
              echo "  - **File:** \`${fname}\`" >> "$NOTES_FILE"
              echo "  - **Direct Download:** [${fname}](https://github.com/${REPO}/releases/download/${DATE_TAG}/${fname})" >> "$NOTES_FILE"
              echo "  - **Obtainium Source URL:** \`https://github.com/${REPO}/releases/tag/${PER_APP_TAG}\`" >> "$NOTES_FILE"
              
              # 1. Update rolling Per-App Release for Obtainium
              echo "[*] Publishing rolling per-app release: ${PER_APP_TAG}"
              gh release delete "${PER_APP_TAG}" --yes --cleanup-tag 2>/dev/null || true
              gh release create "${PER_APP_TAG}" "$apk" \
                --title "${app_name} (${pkg_dir}) v${ver_dir}" \
                --notes "Latest patched build for **${app_name}** (\`${pkg_dir}\`) version \`${ver_dir}\`.\n\n### Obtainium Tracking URL:\n\`https://github.com/${REPO}/releases/tag/${PER_APP_TAG}\`\n\nAdd this URL to Obtainium to receive automatic updates whenever ${app_name} is updated." \
                --latest=false || gh release upload "${PER_APP_TAG}" "$apk" --clobber
                
              # 2. Also create permanent versioned tag (e.g. com.reddit.frontpage-v2026.24.0)
              VER_TAG="${pkg_dir}-v${ver_dir}"
              gh release create "${VER_TAG}" "$apk" \
                --title "${app_name} v${ver_dir}" \
                --notes "Versioned release of ${app_name} v${ver_dir}." \
                --latest=false 2>/dev/null || true
            done
            
            echo "" >> "$NOTES_FILE"
            echo "---" >> "$NOTES_FILE"
            echo "### 📲 Obtainium Setup Guide:" >> "$NOTES_FILE"
            echo "To track and automatically update each app individually in Obtainium:" >> "$NOTES_FILE"
            echo "1. Open Obtainium and tap **Add App**." >> "$NOTES_FILE"
            echo "2. Paste the **Obtainium Source URL** for the app (e.g. \`https://github.com/${REPO}/releases/tag/app-com.reddit.frontpage\`)." >> "$NOTES_FILE"
            echo "3. Obtainium will track that app's dedicated release tag and notify you whenever a new version is compiled!" >> "$NOTES_FILE"
            
            # 3. Create unified batch release
            gh release create "$DATE_TAG" $APK_FILES \
              --title "AutoMorph Build $DATE_TAG" \
              --notes-file "$NOTES_FILE" \
              --latest
              
            echo "RELEASE_URL=https://github.com/${REPO}/releases/tag/$DATE_TAG" >> $GITHUB_OUTPUT
          else
            echo "[!] No new APKs needed building. All tracked apps are up to date."
            echo "TAG=" >> $GITHUB_OUTPUT
            echo "RELEASE_URL=" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report Metrics & Sync to Cloudflare Worker
        if: always()
        env:
          CF_WORKER_URL: ${{ inputs.runner_callback_url || secrets.CLOUDFLARE_WORKER_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          RELEASE_TAG: ${{ steps.release.outputs.TAG }}
          DURATION: ${{ steps.patch.outputs.DURATION || 0 }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$CF_WORKER_URL" ]; then
            echo "[*] No Cloudflare Worker URL specified. Metrics reporting skipped."
            exit 0
          fi

          python3 -c "
          import urllib.request, json, os, glob
          from pathlib import Path

          worker_url = os.environ.get('CF_WORKER_URL').rstrip('/') + '/api/webhook/report'
          secret = os.environ.get('WEBHOOK_SECRET', '')
          tag = os.environ.get('RELEASE_TAG', '')
          repo = os.environ.get('REPO', '')
          duration = int(os.environ.get('DURATION', '0'))

          # Collect patched apps
          patched_apps = []
          for apk in Path('apps/patched').glob('*/*/*.apk'):
              pkg = apk.parent.parent.name
              ver = apk.parent.name
              sz = apk.stat().st_size
              dl_url = f'https://github.com/{repo}/releases/download/{tag}/{apk.name}' if tag else ''
              patched_apps.append({
                  'package': pkg,
                  'version': ver,
                  'arch': 'arm64-v8a',
                  'filename': apk.name,
                  'size_bytes': sz,
                  'download_url': dl_url,
                  'release_url': f'https://github.com/{repo}/releases/tag/{tag}' if tag else None,
              })

          # Collect logs
          log_file = Path('tools/automorph-data/state/logs/last_run.log')
          logs = log_file.read_text(errors='replace').splitlines() if log_file.is_file() else []

          # Collect report HTML
          report_file = Path('tools/automorph-data/state/reports/build_report.html')
          report_html = report_file.read_text(errors='replace') if report_file.is_file() else ''

          repo_versions_file = Path('tools/automorph-data/state/repo_versions.json')
          repo_versions = json.loads(repo_versions_file.read_text()) if repo_versions_file.is_file() else {}

          payload = {
              'run_id': f'run-gh-{tag or "check"}',
              'status': 'success',
              'returncode': 0,
              'duration_seconds': duration,
              'duration_formatted': f'{duration // 60}m {duration % 60}s',
              'source': 'github_actions',
              'patched_apps': patched_apps,
              'logs': logs[-1000:],
              'report_html': report_html,
              'repo_versions': repo_versions,
          }

          req = urllib.request.Request(
              worker_url,
              data=json.dumps(payload).encode('utf-8'),
              headers={
                  'Content-Type': 'application/json',
                  'X-Webhook-Secret': secret,
                  'User-Agent': 'AutoMorph-CloudRunner',
              },
              method='POST'
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  print(f'[✓] Successfully reported metrics to Cloudflare Worker ({resp.status}).')
          except Exception as e:
              print(f'[!] Failed to report metrics to Cloudflare Worker: {e}')
          " || true
